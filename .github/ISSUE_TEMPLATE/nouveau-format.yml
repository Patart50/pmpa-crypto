name: Nouveau format d'export
description: Aidez-nous à reconnaître automatiquement les exports d'une plateforme (Coinbase, Kraken, Bitpanda…)
title: "Format : "
labels: ["import", "nouveau format"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Pour ajouter une plateforme, nous avons besoin de la **structure** de son fichier, pas de vos données.

        **Avant de coller quoi que ce soit, retirez :**
        - vos identifiants (numéro de compte, identifiant utilisateur, identifiants de transaction, adresses de wallet) ;
        - vos montants réels : remplacez-les par des valeurs inventées (ex. 1,23).

        Ne joignez jamais votre fichier complet.
  - type: input
    id: platform
    attributes:
      label: Plateforme
      placeholder: "Kraken"
    validations:
      required: true
  - type: input
    id: export
    attributes:
      label: Nom de l'export et chemin dans l'application
      placeholder: "Historique → Documents → Ledger (CSV)"
    validations:
      required: true
  - type: textarea
    id: headers
    attributes:
      label: Ligne d'en-tête du fichier
      description: La toute première ligne, telle quelle.
      render: text
    validations:
      required: true
  - type: textarea
    id: rows
    attributes:
      label: Quelques lignes anonymisées
      description: Idéalement une ligne par type d'opération (achat, vente, échange, dépôt, retrait, récompense, frais…), avec identifiants et montants remplacés.
      render: text
    validations:
      required: true
  - type: textarea
    id: types
    attributes:
      label: Liste des types d'opérations présents (facultatif)
      description: Les valeurs distinctes de la colonne « type » ou « opération » et leur nombre, si vous savez les obtenir.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: J'ai retiré mes identifiants et remplacé mes montants réels.
          required: true
